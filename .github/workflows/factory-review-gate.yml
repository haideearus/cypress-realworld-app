name: PR 36 required gate recovery
run-name: PR 36 required gate recovery using saved independent approval
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Existing reviewed PR only
        required: true
        default: "36"
        type: choice
        options: ["36"]
permissions:
  contents: read
concurrency:
  group: pr36-required-gate-recovery
  cancel-in-progress: false
jobs:
  revalidate:
    name: Revalidate recorded approval using trusted main verifier
    if: >-
      ${{ github.repository == 'haideearus/cypress-realworld-app' &&
          github.ref == 'refs/heads/recovery/pr36-required-gate' &&
          github.run_attempt == 1 && github.actor == 'haideearus' &&
          github.triggering_actor == 'haideearus' && inputs.pr == '36' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eda135976f98ab00984990810421425615b27041
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
      - name: Run the original main gate and corroborate saved review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PR: ${{ inputs.pr }}
          FACTORY_HEAD: 4bc2ed6c5cbfd71f3367f7d6caa1c1629b565aa8
        run: |
          node <<'RECOVERY'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { GitHub, Ledger } = require('./scripts/factory/github.cjs');
          if (execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim() !== 'eda135976f98ab00984990810421425615b27041') throw new Error('Trusted source checkout changed');
          const workflow = fs.readFileSync('.github/workflows/factory-review-status.yml','utf8');
          const block = workflow.match(/          node <<'NODE'\r?\n([\s\S]*?)\r?\n          NODE/);
          if (!block) throw new Error('Original verifier block not found');
          const original = block[1].split(/\r?\n/).map(line => line.replace(/^          /,'')).join('\n');
          fs.writeFileSync('.pr36-trusted-gate.cjs',original,{flag:'wx'});
          const { verify } = require('./.pr36-trusted-gate.cjs');
          const recover = async function recover({ api, env, verify, readState }) {
            const repo = 'haideearus/cypress-realworld-app';
            const root = `/repos/${repo}`;
            const head = '4bc2ed6c5cbfd71f3367f7d6caa1c1629b565aa8';
            const source = 'eda135976f98ab00984990810421425615b27041';
            const grantId = '121e87bf-451b-473a-86b9-876ae52a1c4d';
            const reviewId = '43530410474';
            const ciId = 43530470220;
            const branch = 'recovery/pr36-required-gate';
            const evidence = `https://github.com/${repo}/actions/runs/${reviewId}`;
            function requireTrue(condition, reason) { if (!condition) throw new Error(reason); }
            requireTrue(env.GITHUB_REPOSITORY === repo && env.GITHUB_REF === `refs/heads/${branch}` &&
              env.GITHUB_WORKFLOW_REF === `${repo}/.github/workflows/factory-review-gate.yml@refs/heads/${branch}` &&
              env.GITHUB_EVENT_NAME === 'workflow_dispatch' && env.GITHUB_ACTOR === 'haideearus' &&
              env.GITHUB_TRIGGERING_ACTOR === 'haideearus' && env.GITHUB_RUN_ATTEMPT === '1' &&
              /^[1-9]\d*$/.test(env.GITHUB_RUN_ID || '') && /^[a-f0-9]{40}$/.test(env.GITHUB_SHA || '') &&
              env.GITHUB_SHA === env.GITHUB_WORKFLOW_SHA && env.FACTORY_PR === '36' && env.FACTORY_HEAD === head,
              'Invalid recovery dispatch context');
            async function current() {
              const pr = await api.request('GET', `${root}/pulls/36`);
              requireTrue(pr.number === 36 && pr.state === 'open' && pr.head?.sha === head &&
                pr.head.repo?.full_name === repo && pr.base?.ref === 'main' && pr.base.sha === source &&
                pr.base.repo?.full_name === repo, 'PR identity, base or reviewed commit changed');
              const result = await verify(env, api);
              requireTrue(result?.ok === true && result.evidence === evidence, 'Trusted main verifier rejected saved proof');
              const state = await readState();
              const ticket = state.tickets?.['35'];
              const approval = ticket?.approval;
              const grant = state.grants?.[grantId];
              requireTrue(state.active === null && ticket?.origin === 'owner-pr' && ticket.status === 'reviewed' &&
                ticket.pr === 36 && ticket.head === head && ticket.coding === 0 && ticket.reviews >= 1 &&
                approval?.grant === grantId && approval.head === head && approval.pr === 36 &&
                approval.verdict === 'pass' && approval.source === 'claude-subscription' && approval.fixture === false &&
                approval.evidence === evidence && grant?.id === grantId && grant.ticket === 35 &&
                grant.head === head && grant.phase === 'review' && grant.slot === 'existing' &&
                grant.status === 'finished' && grant.outcome === 'reviewed' && grant.runId === reviewId &&
                grant.runAttempt === 1 && ticket.ci?.head === head && ticket.ci.runId === ciId && ticket.ci.passed === true,
                'Saved review, grant or exact-commit CI changed');
              return result;
            }
            await current();
            const review = await api.request('GET', `${root}/actions/runs/${reviewId}/attempts/1`);
            const ci = await api.request('GET', `${root}/actions/runs/${ciId}/attempts/1`);
            const validRun = (run, id, sha, path) => run.id === Number(id) && run.run_attempt === 1 &&
              run.repository?.full_name === repo && run.head_repository?.full_name === repo &&
              run.status === 'completed' && run.conclusion === 'success' && run.event === 'workflow_dispatch' &&
              run.head_sha === sha && run.path === path;
            requireTrue(validRun(review, reviewId, source, '.github/workflows/factory-agents.yml') &&
              review.head_branch === 'main' && review.actor?.login === 'haideearus' &&
              review.triggering_actor?.login === 'haideearus', 'Original subscription review run is not verified');
            requireTrue(validRun(ci, ciId, head, '.github/workflows/factory-ci.yml'), 'Original CI run is not verified');
            const jobs = await api.request('GET', `${root}/actions/runs/${reviewId}/attempts/1/jobs?per_page=100`);
            requireTrue(Array.isArray(jobs.jobs) && jobs.jobs.length === jobs.total_count && jobs.jobs.length <= 100,
              'Incomplete review job evidence');
            const executed = jobs.jobs.filter(job => job.status === 'completed' && job.conclusion === 'success' &&
              job.steps?.some(step => step.name === 'Run the one reserved Claude subscription session' && step.conclusion === 'success'));
            requireTrue(executed.length === 1, 'Original independent model session is not verified');
            await current();
            const result = await api.request('POST', `${root}/check-runs`, {
              name: 'Factory review gate', head_sha: head, status: 'completed', conclusion: 'success',
              external_id: `pr36-recovery-${env.GITHUB_RUN_ID}-${head}`,
              details_url: `https://github.com/${repo}/actions/runs/${env.GITHUB_RUN_ID}`,
              output: {
                title: 'Existing independent review revalidated by trusted main gate',
                summary: `Executed the unchanged gate verifier from trusted main ${source}.\n\nPR #36 commit: ${head}\n\nSaved Claude subscription review: ${evidence}\n\nExact-commit CI: https://github.com/${repo}/actions/runs/${ciId}\n\nNo new model session, policy bypass, ledger write, merge, deployment or switch change.`,
              },
            });
            requireTrue(result.app?.id === 15368 && result.name === 'Factory review gate' &&
              result.head_sha === head && result.conclusion === 'success' && Number.isSafeInteger(result.id),
              'GitHub Actions check identity or acknowledgement changed');
            return { checkId: result.id, head, reviewId, ciId, trustedSource: source, details: result.html_url };
          };
          const api = new GitHub({token:process.env.GH_TOKEN});
          recover({api,env:process.env,verify,readState:async()=>(await new Ledger(api).read()).state}).then(result => {
            console.log(JSON.stringify(result));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## PR #36 required gate recovery\n\n'+JSON.stringify(result,null,2)+'\n\nNo new AI invocation. Original main verifier and saved independent approval were revalidated.');
          }).catch(() => {console.error('Recovery verifier refused to report a passing gate; inspect saved evidence.');process.exitCode=1;});
          RECOVERY
