name: Read-only PR 101 API allowance diagnostic
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Diagnostic target only; never writes a check
        required: true
        type: choice
        options: ["101"]
permissions:
  contents: read
jobs:
  diagnose:
    name: Read API reset metadata only
    if: >-
      github.repository == 'haideearus/cypress-realworld-app' &&
      github.actor == 'haideearus' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/agent/pr101-gate-rate-diagnostic' &&
      inputs.pr == '101' &&
      vars.FACTORY_ENABLED == 'false' && vars.FACTORY_AUTOMATION_ENABLED == 'false' &&
      vars.FACTORY_AUTOMERGE_ENABLED == 'false' && vars.FACTORY_DISCOVERY_ENABLED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read the shared GitHub Actions allowance without consuming it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch('https://api.github.com/rate_limit', {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            const data = await response.json();
            const core = data.resources?.core;
            if (!response.ok || !core || !Number.isSafeInteger(core.reset))
              throw Error(`Rate metadata unavailable (${response.status})`);
            console.log(JSON.stringify({ readOnly: true, modelCalls: 0,
              limit: core.limit, remaining: core.remaining, used: core.used,
              resetUtc: new Date(core.reset * 1000).toISOString(),
              observedUtc: new Date().toISOString() }));
          })().catch(() => { console.error('Rate metadata diagnostic failed'); process.exitCode = 1; });
          NODE
