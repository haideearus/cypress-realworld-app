name: Factory independent review gate
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose current-head review should be checked
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/factory-control
        with:
          operation: gate
          variables_json: ${{ toJSON(vars) }}
          parameters: >-
            {"pr":"${{ github.event.pull_request.number || inputs.pr }}"}
