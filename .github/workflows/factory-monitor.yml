name: Production monitor
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check enabled probes without creating tickets or writing monitor state
        type: boolean
        required: true
        default: true
      app_checks:
        description: Include signed-in checks in this preview (requires the two account secrets)
        type: boolean
        required: true
        default: false
      feed_contract:
        description: Include the pagination contract check in this preview only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: factory-production-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: >-
      ${{ github.repository == 'haideearus/cypress-realworld-app' &&
          github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
          github.actor == 'haideearus' &&
          ((github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
           vars.FACTORY_MONITOR_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: factory-ledger
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: read
    env:
      FACTORY_APP_CHECKS_ENABLED: ${{ (vars.FACTORY_APP_CHECKS_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run && (inputs.app_checks || inputs.feed_contract))) && 'true' || 'false' }}
      FACTORY_FEED_CONTRACT_CHECK_ENABLED: ${{ (vars.FACTORY_FEED_CONTRACT_CHECK_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.feed_contract)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
      - name: Check synthetic-user API journey
        if: ${{ env.FACTORY_APP_CHECKS_ENABLED == 'true' }}
        env:
          FACTORY_MONITOR_USERNAME: ${{ secrets.FACTORY_MONITOR_USERNAME }}
          FACTORY_MONITOR_PASSWORD: ${{ secrets.FACTORY_MONITOR_PASSWORD }}
        run: node scripts/factory/app-checks.cjs
      - name: Scan credential-free app check report
        if: ${{ env.FACTORY_APP_CHECKS_ENABLED == 'true' }}
        run: node scripts/factory/app-checks-scan.cjs
      - name: Observe production and publish incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_MONITOR_ENABLED: ${{ vars.FACTORY_MONITOR_ENABLED }}
          MONITOR_DRY_RUN: ${{ toJSON(inputs.dry_run) }}
          FACTORY_VARIABLES: ${{ toJSON(vars) }}
        run: node scripts/factory/monitor.cjs
