name: Factory agents
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Initialize, code, recover issue 11 once, review an owner PR, or cancel
        required: true
        default: run
        type: choice
        options: [initialize, run, recover, review, cancel]
      ticket:
        description: Open issue for run; issue 11 only for recover; ignored for initialize/cancel
        required: false
        default: ""
        type: string
      pr:
        description: Existing owner-authored PR number, for operation review only
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  initialize:
    if: ${{ inputs.operation == 'initialize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: factory-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/factory-control
        with:
          operation: initialize
          variables_json: ${{ toJSON(vars) }}
  cancel:
    if: ${{ inputs.operation == 'cancel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: factory-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/factory-control
        with:
          operation: cancel
          variables_json: ${{ toJSON(vars) }}
  admit:
    if: ${{ inputs.operation == 'run' || inputs.operation == 'recover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
    concurrency:
      group: factory-ledger
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.control.outputs.ready }}
      grantId: ${{ steps.control.outputs.grantId }}
      head: ${{ steps.control.outputs.head }}
      ticket: ${{ steps.control.outputs.ticket }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: control
        uses: ./.github/actions/factory-control
        with:
          operation: admit
          variables_json: ${{ toJSON(vars) }}
          parameters: ${{ toJSON(inputs) }}
  cycle1:
    needs: admit
    if: ${{ needs.admit.outputs.ready == 'true' && vars.FACTORY_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.admit.outputs.ticket }}
      grantId: ${{ needs.admit.outputs.grantId }}
      head: ${{ needs.admit.outputs.head }}
      slot: cycle1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  admit_pr:
    if: ${{ inputs.operation == 'review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
    concurrency:
      group: factory-ledger
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.control.outputs.ready }}
      grantId: ${{ steps.control.outputs.grantId }}
      head: ${{ steps.control.outputs.head }}
      ticket: ${{ steps.control.outputs.ticket }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: control
        uses: ./.github/actions/factory-control
        with:
          operation: admit_pr
          variables_json: ${{ toJSON(vars) }}
          parameters: ${{ toJSON(inputs) }}
  review_existing:
    needs: admit_pr
    if: ${{ needs.admit_pr.outputs.ready == 'true' && vars.FACTORY_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: write
      checks: write
    uses: ./.github/workflows/factory-pr-review.yml
    with:
      ticket: ${{ needs.admit_pr.outputs.ticket }}
      grantId: ${{ needs.admit_pr.outputs.grantId }}
      head: ${{ needs.admit_pr.outputs.head }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  cycle2:
    needs: cycle1
    if: ${{ needs.cycle1.outputs.retry == 'true' && vars.FACTORY_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.cycle1.outputs.ticket }}
      grantId: ${{ needs.cycle1.outputs.grantId }}
      head: ${{ needs.cycle1.outputs.head }}
      slot: cycle2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
