name: Automatic factory
run-name: ${{ inputs.timer_tick && format('Automatic factory / timer {0}', inputs.timer_tick) || inputs.wake_id && format('Automatic factory / wake {0}', inputs.wake_id) || 'Automatic factory' }}
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Automatic pickup, blocked retry setup, or an approved finding recovery
        type: choice
        options:
          [
            run,
            retry-finding,
            continue-finding,
            recover-finding,
            retry-finding-api,
            queue-blocked-retry,
          ]
        default: run
      ticket:
        description: Issue number for explicit blocked retry or finding recovery
        type: string
        default: ""
      fix_pr:
        description: Merged harness fix PR for queue-blocked-retry only
        type: string
        default: ""
      wake_id:
        description: Receipt from the trusted event bridge (never authorization by itself)
        type: string
        required: false
        default: ""
      timer_tick:
        description: Scheduled UTC timestamp in milliseconds, supplied by the Cloudflare pickup timer
        type: string
        default: ""
      dry_run:
        description: Preview the selected operation without reservations, model calls or merges
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: factory-automatic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  pick:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.dry_run) || (vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      group: factory-ledger
      cancel-in-progress: false
      queue: max
    outputs:
      ready: ${{ steps.control.outputs.ready }}
      grantId: ${{ steps.control.outputs.grantId }}
      head: ${{ steps.control.outputs.head }}
      ticket: ${{ steps.control.outputs.ticket }}
      review_only: ${{ steps.control.outputs.reviewOnly }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ inputs.timer_tick || (github.event_name == 'schedule' && vars.FACTORY_EXTERNAL_PICKUP_ENABLED == 'true') }}
        with:
          node-version: 22.20.0
      - name: Check the pickup timer
        id: timer
        if: ${{ inputs.timer_tick || (github.event_name == 'schedule' && vars.FACTORY_EXTERNAL_PICKUP_ENABLED == 'true') }}
        run: node scripts/factory/pickup-timer.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_INPUTS: ${{ toJSON(inputs) }}
          FACTORY_EXTERNAL_PICKUP_ENABLED: ${{ vars.FACTORY_EXTERNAL_PICKUP_ENABLED }}
          FACTORY_MAX_CONCURRENT_TICKETS: ${{ vars.FACTORY_MAX_CONCURRENT_TICKETS }}
      - id: app
        if: ${{ (steps.timer.outcome == 'skipped' || steps.timer.outputs.allowed == 'true') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: ./.github/actions/factory-app-token
        with:
          client-id: ${{ vars.FACTORY_GITHUB_APP_CLIENT_ID }}
          expected-slug: ${{ vars.FACTORY_GITHUB_APP_SLUG }}
          private-key: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
      - name: Select eligible factory work
        id: control
        if: ${{ steps.timer.outcome == 'skipped' || steps.timer.outputs.allowed == 'true' }}
        uses: ./.github/actions/factory-control
        with:
          operation: auto_pick
          github_token: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.token || steps.app.outputs.token }}
          variables_json: ${{ toJSON(vars) }}
          parameters: ${{ toJSON(inputs) }}
      - name: Record selected work for this timer check
        if: ${{ steps.timer.outputs.allowed == 'true' && steps.control.outputs.ticket != '' }}
        run: echo 'Pickup selected work for dispatch or merge recovery.' >> "$GITHUB_STEP_SUMMARY"
      - name: Hand off an idle app queue to dependency maintenance
        if: >-
          ${{ (github.event_name == 'schedule' || steps.timer.outputs.allowed == 'true') &&
              vars.FACTORY_EVENT_PICKUP_ENABLED == 'true' &&
              steps.control.outputs.ready == 'false' && steps.control.outputs.ticket == '' }}
        run: echo 'App pickup found no ticket. The event wake can inspect the dependency queue.'
  cycle1:
    needs: pick
    if: ${{ needs.pick.outputs.ready == 'true' && vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.pick.outputs.ticket }}
      grantId: ${{ needs.pick.outputs.grantId }}
      head: ${{ needs.pick.outputs.head }}
      slot: cycle1
      automatic: true
      review_only: ${{ needs.pick.outputs.review_only == 'true' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
  cycle2:
    needs: cycle1
    if: ${{ needs.cycle1.outputs.retry == 'true' && vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.cycle1.outputs.ticket }}
      grantId: ${{ needs.cycle1.outputs.grantId }}
      head: ${{ needs.cycle1.outputs.head }}
      slot: cycle2
      automatic: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
  cycle3:
    needs: cycle2
    if: ${{ needs.cycle2.outputs.retry == 'true' && vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.cycle2.outputs.ticket }}
      grantId: ${{ needs.cycle2.outputs.grantId }}
      head: ${{ needs.cycle2.outputs.head }}
      slot: cycle3
      automatic: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
  cycle4:
    needs: cycle3
    if: ${{ needs.cycle3.outputs.retry == 'true' && vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.cycle3.outputs.ticket }}
      grantId: ${{ needs.cycle3.outputs.grantId }}
      head: ${{ needs.cycle3.outputs.head }}
      slot: cycle4
      automatic: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
  cycle5:
    needs: cycle4
    if: ${{ needs.cycle4.outputs.retry == 'true' && vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true' }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: ./.github/workflows/factory-cycle.yml
    with:
      ticket: ${{ needs.cycle4.outputs.ticket }}
      grantId: ${{ needs.cycle4.outputs.grantId }}
      head: ${{ needs.cycle4.outputs.head }}
      slot: cycle5
      automatic: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
  merge:
    needs: [pick, cycle1, cycle2, cycle3, cycle4, cycle5]
    if: ${{ always() && !cancelled() && inputs.operation != 'retry-finding' && inputs.operation != 'continue-finding' && inputs.operation != 'recover-finding' && inputs.operation != 'retry-finding-api' && inputs.operation != 'queue-blocked-retry' && needs.pick.outputs.ticket != '' && vars.FACTORY_ENABLED == 'true' && vars.FACTORY_AUTOMATION_ENABLED == 'true' && vars.FACTORY_AUTOMERGE_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: factory-auto-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: app
        uses: ./.github/actions/factory-app-token
        with:
          client-id: ${{ vars.FACTORY_GITHUB_APP_CLIENT_ID }}
          expected-slug: ${{ vars.FACTORY_GITHUB_APP_SLUG }}
          private-key: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/factory-control
        with:
          operation: auto_merge
          github_token: ${{ steps.app.outputs.token }}
          variables_json: ${{ toJSON(vars) }}
          parameters: >-
            {"ticket":"${{ needs.pick.outputs.ticket }}","dry_run":false}
