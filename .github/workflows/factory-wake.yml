name: Factory event wake
on:
  issues:
    types: [opened, labeled, reopened, edited]
  workflow_run:
    workflows:
      [Production monitor, Factory CI, Automatic factory, Dependency maintenance, Factory agents]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preview, initialize]
        default: preview
      preview:
        description: Inspect only; never dispatch a worker
        type: boolean
        default: true
      issue:
        description: Owner issue number to inspect
        type: string
        default: ""
permissions:
  contents: read
jobs:
  wake:
    if: ${{ github.repository == 'haideearus/cypress-realworld-app' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || vars.FACTORY_EVENT_PICKUP_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Verify metadata signal and receipt before bounded dispatch
        run: node scripts/factory/wake.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_VARIABLES: ${{ toJSON(vars) }}
